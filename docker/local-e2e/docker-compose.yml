services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "${E2E_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${E2E_CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      # Applies the repo's real sql/*.sql and sql/study-authz/*.sql on top of
      # the fixture (see the script).
      - ./init-apply-repo-sql.sh:/docker-entrypoint-initdb.d/10-apply-repo-sql.sh:ro
      - ../../sql:/cbioportal-sql:ro
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/cbioportal-mcp-custom-settings.xml:ro
    environment:
      # acl (default) or authorities: which sql/study-authz policy set the
      # init script applies. Must match the mcp service's source below.
      STUDY_AUTHZ_SOURCE: ${STUDY_AUTHZ_SOURCE:-acl}
      STUDY_AUTHZ_REFRESH_MINUTES: "1"
      # Entitlements older than this grant nothing (the e2e waits it out).
      STUDY_AUTHZ_MAX_STALENESS_SECONDS: "90"
    healthcheck:
      # During init the entrypoint's temporary server listens on 127.0.0.1
      # only; pinging the container's own address passes once init (incl.
      # sql/2's ~900 mutations) is done and the real server is up.
      test: ["CMD-SHELL", "wget --spider -q http://$$(hostname -i | cut -d' ' -f1):8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browser-facing URL (and token issuer) is the host port; containers
      # reach the same realm via http://keycloak:8080 (backchannel).
      KC_HOSTNAME: http://127.0.0.1:${E2E_KEYCLOAK_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${E2E_KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/cbioportal-mcp-local-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/cbioportal-mcp-local/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 60

  mcp:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: mcp_authz
      CLICKHOUSE_PASSWORD: mcp_authz_pw
      CLICKHOUSE_DATABASE: cbioportal_authz_e2e
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CBIOPORTAL_MCP_STUDY_ACCESS_MODE: restricted
      CBIOPORTAL_MCP_AUTH_REQUIRED: "true"
      CBIOPORTAL_MCP_STUDY_ACL_FILE: /app/docker/local-e2e/study-acl.json
      CBIOPORTAL_MCP_AUTH_PROXY_SECRET: local-proxy-secret
      CBIOPORTAL_MCP_CLICKHOUSE_ROW_POLICY_ENABLED: "true"
      # authorities: ClickHouse resolves studies from the fixture's
      # authorities table; the verified email comes from the auth proxy's
      # x-user-email header, accepted only with the proxy secret above.
      CBIOPORTAL_MCP_STUDY_ACCESS_SOURCE: ${STUDY_AUTHZ_SOURCE:-acl}
      CBIOPORTAL_MCP_STUDY_ACCESS_IDENTITY: proxy
      # Short so the e2e can watch the periodic safety re-check react.
      CBIOPORTAL_MCP_ROW_POLICY_RECHECK_SECONDS: "3"
    ports:
      - "${E2E_MCP_PORT:-8000}:8000"

  auth-proxy:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: ["uv", "run", "cbioportal-mcp-local-keycloak-proxy"]
    depends_on:
      keycloak:
        condition: service_healthy
      mcp:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOCAL_AUTH_PROXY_BIND_HOST: 0.0.0.0
      LOCAL_AUTH_PROXY_BIND_PORT: "8001"
      LOCAL_AUTH_PROXY_UPSTREAM_MCP_URL: http://mcp:8000/mcp
      LOCAL_AUTH_PROXY_KEYCLOAK_INTROSPECTION_URL: http://host.docker.internal:${E2E_KEYCLOAK_PORT:-18080}/realms/cbioportal-mcp-local/protocol/openid-connect/token/introspect
      LOCAL_AUTH_PROXY_KEYCLOAK_HOST_HEADER: 127.0.0.1:${E2E_KEYCLOAK_PORT:-18080}
      LOCAL_AUTH_PROXY_KEYCLOAK_CLIENT_ID: mcp-local-proxy
      LOCAL_AUTH_PROXY_KEYCLOAK_CLIENT_SECRET: mcp-local-proxy-secret
      LOCAL_AUTH_PROXY_SECRET: local-proxy-secret
    ports:
      - "${E2E_PROXY_PORT:-8001}:8001"

  # --- per-deployment login providers (profile "providers") -------------------
  # One MCP per provider, all against the same ClickHouse fixture and the acl
  # policy set (jwt and portal_dat send SQL_cbiomcp_allowed_studies). Start
  # with STUDY_AUTHZ_SOURCE=acl (the default) and `--profile providers`;
  # verify with scripts/local_e2e_auth_providers.py.

  mock-okta:
    profiles: ["providers"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: ["uv", "run", "python", "-m", "cbioportal_mcp.local_e2e_fakes"]
    environment:
      LOCAL_E2E_FAKE: oidc
      FAKE_PORT: "8080"
      # Okta-shaped: custom authorization server, login in sub, uid, a custom
      # cbio_studies claim, no email_verified. carol has no studies claim.
      MOCK_OIDC_ISSUER: http://127.0.0.1:${E2E_OKTA_PORT:-18092}/oauth2/default
      MOCK_OIDC_AUDIENCE: api://default
      MOCK_OIDC_USERS: >-
        {"alice@example.org": {"uid": "00u-alice", "groups": ["Everyone"], "studies": ["study_alpha"]},
         "bob@example.org": {"uid": "00u-bob", "groups": ["Everyone"], "studies": ["study_beta"]},
         "carol@example.org": {"uid": "00u-carol", "groups": []}}
    ports:
      - "${E2E_OKTA_PORT:-18092}:8080"

  fake-portal:
    profiles: ["providers"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: ["uv", "run", "python", "-m", "cbioportal_mcp.local_e2e_fakes"]
    environment:
      LOCAL_E2E_FAKE: portal
      FAKE_PORT: "8080"
      FAKE_PORTAL_USERS: >-
        {"alice@example.org": {"studies": ["study_alpha"], "token": "e2e-dat-alice-0000-0000-000000000001"},
         "bob": {"studies": ["study_beta"], "token": "e2e-dat-bob-0000-0000-0000-000000000002"},
         "carol": {"studies": ["study_alpha", "study_beta"], "token": "e2e-dat-carol-000-0000-0000-000000000003"}}
    ports:
      - "${E2E_PORTAL_PORT:-18091}:8080"

  mcp-oidc-keycloak:
    profiles: ["providers"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment: &provider_mcp_env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: mcp_authz
      CLICKHOUSE_PASSWORD: mcp_authz_pw
      CLICKHOUSE_DATABASE: cbioportal_authz_e2e
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "${E2E_MCP_KEYCLOAK_PORT:-18100}"
      CBIOPORTAL_MCP_STUDY_ACCESS_MODE: restricted
      CBIOPORTAL_MCP_CLICKHOUSE_ROW_POLICY_ENABLED: "true"
      CBIOPORTAL_MCP_STUDY_ACCESS_SOURCE: jwt
      CBIOPORTAL_MCP_AUTH_PROVIDER: oidc
      CBIOPORTAL_MCP_OIDC_ALLOW_INSECURE_HTTP_FOR_LOCAL_TESTING: "true"
      CBIOPORTAL_MCP_OIDC_REQUIRE_CONSENT: "false"
      CBIOPORTAL_MCP_OIDC_ISSUER_URL: http://127.0.0.1:${E2E_KEYCLOAK_PORT:-18080}/realms/cbioportal-mcp-local
      CBIOPORTAL_MCP_OIDC_CONFIG_URL: http://keycloak:8080/realms/cbioportal-mcp-local/.well-known/openid-configuration
      CBIOPORTAL_MCP_OIDC_CLIENT_ID: mcp-oidc
      CBIOPORTAL_MCP_OIDC_CLIENT_SECRET: mcp-oidc-local-secret-0123456789
      CBIOPORTAL_MCP_OIDC_BASE_URL: http://127.0.0.1:${E2E_MCP_KEYCLOAK_PORT:-18100}
      CBIOPORTAL_MCP_OIDC_AUDIENCE: cbioportal-mcp
      CBIOPORTAL_MCP_OIDC_STUDIES_CLAIM: realm_access.roles
      CBIOPORTAL_MCP_OIDC_STUDIES_CLAIM_PREFIX: "cbioportal:"
      CBIOPORTAL_MCP_ROW_POLICY_RECHECK_SECONDS: "30"
    ports:
      - "${E2E_MCP_KEYCLOAK_PORT:-18100}:${E2E_MCP_KEYCLOAK_PORT:-18100}"

  mcp-oidc-okta:
    profiles: ["providers"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      mock-okta:
        condition: service_started
    environment:
      <<: *provider_mcp_env
      CLICKHOUSE_MCP_BIND_PORT: "${E2E_MCP_OKTA_PORT:-18101}"
      CBIOPORTAL_MCP_OIDC_ISSUER_URL: http://127.0.0.1:${E2E_OKTA_PORT:-18092}/oauth2/default
      CBIOPORTAL_MCP_OIDC_CONFIG_URL: http://mock-okta:8080/oauth2/default/.well-known/openid-configuration
      CBIOPORTAL_MCP_OIDC_CLIENT_ID: mock-client
      CBIOPORTAL_MCP_OIDC_CLIENT_SECRET: mock-client-secret-0123456789abcdef
      CBIOPORTAL_MCP_OIDC_BASE_URL: http://127.0.0.1:${E2E_MCP_OKTA_PORT:-18101}
      CBIOPORTAL_MCP_OIDC_AUDIENCE: api://default
      CBIOPORTAL_MCP_OIDC_USER_ID_CLAIM: uid
      CBIOPORTAL_MCP_OIDC_EMAIL_CLAIM: sub
      CBIOPORTAL_MCP_OIDC_GROUPS_CLAIM: groups
      CBIOPORTAL_MCP_OIDC_STUDIES_CLAIM: cbio_studies
      CBIOPORTAL_MCP_OIDC_STUDIES_CLAIM_PREFIX: ""
    ports:
      - "${E2E_MCP_OKTA_PORT:-18101}:${E2E_MCP_OKTA_PORT:-18101}"

  mcp-portal-dat:
    profiles: ["providers"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      fake-portal:
        condition: service_started
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: mcp_authz
      CLICKHOUSE_PASSWORD: mcp_authz_pw
      CLICKHOUSE_DATABASE: cbioportal_authz_e2e
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CBIOPORTAL_MCP_STUDY_ACCESS_MODE: restricted
      CBIOPORTAL_MCP_CLICKHOUSE_ROW_POLICY_ENABLED: "true"
      CBIOPORTAL_MCP_AUTH_PROVIDER: portal_dat
      CBIOPORTAL_MCP_STUDY_ACCESS_SOURCE: portal_dat
      CBIOPORTAL_MCP_PORTAL_URL: http://fake-portal:8080
      CBIOPORTAL_MCP_PORTAL_ALLOW_INSECURE_HTTP_FOR_LOCAL_TESTING: "true"
      CBIOPORTAL_MCP_PORTAL_DAT_HMAC_SECRET: local-e2e-dat-hmac-secret-0123456789abcdef
      CBIOPORTAL_MCP_PORTAL_CONFIRM_SHOW_UNAUTHORIZED_STUDIES_OFF: "true"
      CBIOPORTAL_MCP_PORTAL_DAT_CACHE_SECONDS: "5"
      CBIOPORTAL_MCP_ROW_POLICY_RECHECK_SECONDS: "30"
    ports:
      - "${E2E_MCP_DAT_PORT:-18102}:8000"
