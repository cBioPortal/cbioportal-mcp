[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbioportal-mcp"
version = "0.1.0"
description = "A specialized MCP interface for cBioPortal data analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "cBioPortal MCP Contributors" }
]
dependencies = [
    "fastmcp>=2.12.3,<3.0.0",
    # 0.5.0 caches clients natively (connection reuse, server-side cancellation,
    # https://github.com/ClickHouse/mcp-clickhouse/pull/152) so cbioportal_mcp no
    # longer needs its own pooling patch. Stay off 0.6.0, which moves to FastMCP 4.
    "mcp-clickhouse==0.5.0",
    "clickhouse-driver>=0.2.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "ddtrace",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
]

[project.scripts]
cbioportal-mcp = "cbioportal_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cbioportal_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

# Include resource files in the package
[tool.hatch.build.targets.wheel.force-include]
"src/cbioportal_mcp/resources" = "cbioportal_mcp/resources"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "B", "I"]
ignore = []