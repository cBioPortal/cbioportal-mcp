name: Unit tests

on:
  pull_request:
    branches:
      - beta
      - main
  push:
    branches:
      - beta
  # docker_ci.yml calls this before publishing an image.
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the triggering SHA)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so the copy
  # docker_ci.yml runs never cancels (or is cancelled by) the standalone run.
  group: unit-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # 3.10, not the Dockerfile's 3.11 base: .python-version pins 3.10, so
      # `uv sync` in the image installs and runs 3.10. Test what ships.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      # Install exactly the locked dependency set. Tests that need a live
      # ClickHouse (or the clickhouse binary) skip themselves when it is absent.
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run --frozen pytest -q
