name: Unit tests

on:
  pull_request:
    branches:
      - beta
      - main
  push:
    branches:
      - beta

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      # Install exactly the locked dependency set. Tests that need a live
      # ClickHouse (or the clickhouse binary) skip themselves when it is absent.
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run --frozen pytest -q
