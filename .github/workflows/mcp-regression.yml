# Compares this PR's server against the released image on a fixed set of tool calls.
# Tests and workflow: https://github.com/cBioPortal/cbioportal-mcp-qa (mcp_tests/calls/mcp.yaml).
# Label a PR `mcp-behavior-change` when the difference is intended; diffs are then report-only.
#
# On beta the baseline is the beta image, and the server needs its study-authz
# switches set explicitly (all off here: no study filtering in CI).
name: MCP regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  mcp-regression:
    uses: cBioPortal/cbioportal-mcp-qa/.github/workflows/mcp-regression.yml@8d9bb1a27ea8024b1bc1cd9130c47530a6a76a8c
    with:
      server: mcp
      qa-ref: 8d9bb1a27ea8024b1bc1cd9130c47530a6a76a8c
      baseline-image: cbioportal/mcp:beta
      server-env: |
        CBIOPORTAL_MCP_STUDY_FILTERING=off
        CBIOPORTAL_MCP_AUTH_ENFORCEMENT=off
        CBIOPORTAL_MCP_AUTH_TEST_USERS=
        CBIOPORTAL_MCP_PUBLIC_DB_CHECK=off
    secrets: inherit
