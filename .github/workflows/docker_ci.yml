name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      ref:
        description: "Docker tag / ref (no slashes) to build and tag the image: branch, tag, or commit SHA"
        type: string
        required: true

jobs:
  # Pin what this run tests and publishes to one immutable commit. Every later
  # job checks out needs.resolve.outputs.sha and nothing else, so a branch that
  # moves mid-run (workflow_dispatch with a branch name) can't make the gates
  # test one commit while a build leg packages another. The input ref is only
  # a label (the Docker tag); it never selects content after this job.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      # Validate the tag before using the input anywhere else.
      - name: Choose image tag
        id: tag
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Whole-string match (not per-line like grep -x): the ref must be exactly one
            # Docker tag, so a newline can't smuggle extra lines into $GITHUB_OUTPUT.
            tag_re='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
            if ! [[ "$INPUT_REF" =~ $tag_re ]]; then
              echo "ref is not a valid Docker tag: $INPUT_REF" >&2
              exit 1
            fi
            tag="$INPUT_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "beta" ]; then
            # Beta pushes publish only :beta and must never touch :latest.
            tag=beta
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            tag=latest
          else
            echo "Unexpected trigger $EVENT_NAME on $REF_NAME; refusing to pick a tag" >&2
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          LC_ALL: C

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve to a full commit SHA
        id: resolve
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the ref to a full commit SHA: '$sha'" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$sha" != "$GITHUB_SHA" ]; then
            echo "Checked out $sha but the push was $GITHUB_SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing and publishing commit $sha"
        env:
          EVENT_NAME: ${{ github.event_name }}
          LC_ALL: C

  # Publishing gates: nothing is pushed or tagged (:latest, :beta, or a
  # dispatched ref) unless the unit tests and the hermetic MCP contract tier
  # (mcp-contract.yml: the built image against a fixture ClickHouse with prod's
  # chat env) pass for the exact commit being published.
  unit-tests:
    needs: [resolve]
    uses: ./.github/workflows/unit-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  contract:
    needs: [resolve]
    uses: ./.github/workflows/mcp-contract.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Per-architecture build on a native runner. arm64 uses ubuntu-24.04-arm
  # (free on public repos), avoiding the ~5-10x slowdown of QEMU emulation.
  build:
    needs: [resolve, unit-tests, contract]
    # Explicit, with no status function (always()/!cancelled()), so the implicit
    # success() also applies: a skipped, failed or cancelled gate skips this
    # job, including when only this job is re-run.
    if: needs.resolve.result == 'success' && needs.unit-tests.result == 'success' && needs.contract.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout and set platform
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "Checked out $head, expected $SHA" >&2
            exit 1
          fi
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          # Path context: build the checked-out tree (verified == $SHA above),
          # not a git context that would re-resolve a ref.
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          # Push by digest only; the merge job tags the final manifest.
          outputs: type=image,name=cbioportal/mcp,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}-${{ env.IMAGE_TAG }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }}-${{ env.IMAGE_TAG }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # The artifact name carries the SHA, so the merge job (which selects by
      # it) can never pick up a digest built from another commit, e.g. one left
      # by an earlier attempt of this run.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ needs.resolve.outputs.sha }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, unit-tests, contract, build]
    # Same guard as build: every gate for this SHA and both build legs passed.
    if: needs.resolve.result == 'success' && needs.unit-tests.result == 'success' && needs.contract.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ needs.resolve.outputs.sha }}-*
          merge-multiple: true

      - name: Check one digest per platform
        working-directory: /tmp/digests
        shell: bash
        run: |
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected 2 digests (amd64, arm64) for $SHA, found ${#digests[@]}: ${digests[*]}" >&2
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          refs=()
          for d in *; do refs+=("cbioportal/mcp@sha256:$d"); done
          docker buildx imagetools create -t "cbioportal/mcp:$IMAGE_TAG" "${refs[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "cbioportal/mcp:$IMAGE_TAG"
