name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and tag the image (branch, tag, or commit SHA)"
        type: string
        required: true

jobs:
  # Per-architecture build on a native runner. arm64 uses ubuntu-24.04-arm
  # (free on public repos), avoiding the ~5-10x slowdown of QEMU emulation.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Set image tag
        id: set-tag
        run: |
          if [ -n "$INPUT_REF" ]; then
            # Must be a valid Docker tag; this also rejects newlines that could inject into $GITHUB_ENV.
            if ! printf '%s' "$INPUT_REF" | grep -Eqx '[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}'; then
              echo "ref is not a valid Docker tag: $INPUT_REF" >&2
              exit 1
            fi
            echo "IMAGE_TAG=$INPUT_REF" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "beta" ]; then
            # Beta pushes publish only :beta and must never touch :latest.
            echo "IMAGE_TAG=beta" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "Unexpected trigger $EVENT_NAME on $REF_NAME; refusing to pick a tag" >&2
            exit 1
          fi
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # Push by digest only; the merge job tags the final manifest.
          outputs: type=image,name=cbioportal/mcp,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}-${{ env.IMAGE_TAG }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }}-${{ env.IMAGE_TAG }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Set image tag
        run: |
          if [ -n "$INPUT_REF" ]; then
            # Must be a valid Docker tag; this also rejects newlines that could inject into $GITHUB_ENV.
            if ! printf '%s' "$INPUT_REF" | grep -Eqx '[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}'; then
              echo "ref is not a valid Docker tag: $INPUT_REF" >&2
              exit 1
            fi
            echo "IMAGE_TAG=$INPUT_REF" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "beta" ]; then
            # Beta pushes publish only :beta and must never touch :latest.
            echo "IMAGE_TAG=beta" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "Unexpected trigger $EVENT_NAME on $REF_NAME; refusing to pick a tag" >&2
            exit 1
          fi
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "cbioportal/mcp:$IMAGE_TAG" \
            $(printf 'cbioportal/mcp@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "cbioportal/mcp:$IMAGE_TAG"
